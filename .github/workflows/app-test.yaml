name: App Test

on:
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - build.gradle.kts
      - settings.gradle.kts
      - buildSrc/**
      - gradle.properties
      - gradle/**

concurrency:
  group: app-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  check-formatting:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Run Spotless Check
        run: ./gradlew :spotlessCheck --stacktrace --configuration-cache
   
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Run Unit Tests
        run: ./gradlew :test --stacktrace --configuration-cache

      - name: Unit Test Reports
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        if: always()
        with:
          name: Unit Test Reports
          path: 'build/test-results/test/*.xml'
          reporter: java-junit

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest-8-cores
    strategy:
      fail-fast: false
      matrix:
        kubernetes: [v1.34.2, v1.35.1]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Run Integration Tests
        env:
          TEST_KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: ./gradlew :integrationTest --stacktrace --configuration-cache

      - name: Integration Test Reports
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        if: always()
        with:
          name: Integration Test Reports - Kubernetes ${{ matrix.kubernetes }}
          path: 'build/test-results/integrationTest/*.xml'
          reporter: java-junit
