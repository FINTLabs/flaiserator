name: Chart Test

on:
  pull_request:
    branches:
      - main
    paths:
      - charts/**
      - scripts/test-helm-charts.sh

concurrency:
  group: chart-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-chart-tests:
    name: Run Helm Chart Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42

      - name: Run Helm Chart Tests
        run: scripts/test-helm-charts.sh
