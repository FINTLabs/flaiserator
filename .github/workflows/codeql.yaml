name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 5 * * 0,3,5"

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      actions: ${{ steps.filter.outputs.actions }}
      java_kotlin: ${{ steps.filter.outputs.java_kotlin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            actions:
              - ".github/workflows/**"
              - ".github/actions/**"
            java_kotlin:
              - "src/**"
              - "buildSrc/**"
              - "gradle/**"
              - "build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle.properties"

  analyze-actions:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    needs: detect-changes
    env:
      run_analysis: ${{ github.event_name == 'schedule' || needs.detect-changes.outputs.actions == 'true' }}
    steps:
      - if: env.run_analysis == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - if: env.run_analysis == 'true'
        uses: github/codeql-action/init@0911ee96d2d6c8def97122c36c5cadd93829a4b4
        with:
          languages: actions

      - if: env.run_analysis == 'true'
        uses: github/codeql-action/analyze@0911ee96d2d6c8def97122c36c5cadd93829a4b4
        with:
          category: /language:actions

  analyze-java-kotlin:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    needs: detect-changes
    env:
      run_analysis: ${{ github.event_name == 'schedule' || needs.detect-changes.outputs.java_kotlin == 'true' }}
    steps:
      - if: env.run_analysis == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - if: env.run_analysis == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 21

      - if: env.run_analysis == 'true'
        uses: github/codeql-action/init@0911ee96d2d6c8def97122c36c5cadd93829a4b4
        with:
          languages: java-kotlin
          build-mode: autobuild

      - if: env.run_analysis == 'true'
        uses: github/codeql-action/analyze@0911ee96d2d6c8def97122c36c5cadd93829a4b4
        with:
          category: /language:java-kotlin
