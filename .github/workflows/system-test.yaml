name: System Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - charts/**
      - src/main/**
      - src/test/system/**
      - src/test/common/**
      - build.gradle.kts
      - settings.gradle.kts
      - buildSrc/**
      - gradle.properties
      - gradle/**
      - gradlew
      - .github/workflows/system-test.yaml

concurrency:
  group: system-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  system-tests:
    name: Test Docker image and Helm installation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
        fail-fast: false
        matrix:
            kubernetes: [v1.34.2, v1.35.1]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1

      - name: Run system tests
        env:
          TEST_KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: ./gradlew --no-daemon spotlessCheck systemTest --stacktrace

      - name: Upload system test diagnostics
        uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: system-test-diagnostics-${{ matrix.kubernetes }}
          path: |
            build/system-test/
            build/test-results/systemTest/
          retention-days: 7

      - name: System Test Reports
        uses: dorny/test-reporter@v3.2.0
        if: always()
        with:
            name: System Test Reports - Kubernetes ${{ matrix.kubernetes }}
            path: 'build/test-results/systemTest/*.xml'
            reporter: java-junit
