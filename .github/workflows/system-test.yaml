name: System Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - charts/**
      - src/main/**
      - src/test/system/**
      - src/test/common/**
      - build.gradle.kts
      - settings.gradle.kts
      - buildSrc/**
      - gradle.properties
      - gradle/**
      - gradlew
      - .github/workflows/system-test.yaml

concurrency:
  group: system-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  system-tests:
    name: Test Docker image and Helm installation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
        fail-fast: false
        matrix:
            kubernetes: [v1.34.2, v1.35.1]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e

      - name: Run system tests
        env:
          TEST_KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: ./gradlew --no-daemon spotlessCheck systemTest --stacktrace

      - name: Upload system test diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: system-test-diagnostics-${{ matrix.kubernetes }}
          path: |
            build/system-test/
            build/test-results/systemTest/
          retention-days: 7

      - name: System Test Reports
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        if: always()
        with:
            name: System Test Reports - Kubernetes ${{ matrix.kubernetes }}
            path: 'build/test-results/systemTest/*.xml'
            reporter: java-junit
