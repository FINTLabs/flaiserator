name: App Build

on:
  workflow_call:
    outputs:
      version:
        description: "Docker image tag version"
        value: ${{ jobs.meta.outputs.version }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: commit-hash
        uses: prompt/actions-commit-hash@3e5394f02ec5873db7db490a9b1190d7d88bea49

      - id: version
        run: echo "version=$(date +'%Y%m%d')-${{ steps.commit-hash.outputs.short }}" >> $GITHUB_OUTPUT

  build-and-publish:
    name: Build & Publish Docker
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0

      - name: Gradle test and build
        run: ./gradlew build --configuration-cache

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: docker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=${{ needs.meta.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: docker-build-push
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}


      - name: Print docker tag
        run: echo 'Docker-tag er ${{ steps.docker-meta.outputs.tags }} ' >> $GITHUB_STEP_SUMMARY